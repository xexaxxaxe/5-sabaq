<!doctype html><html lang="ru"><meta charset="utf-8"><title>Вход</title>
<style>body{font-family:Arial;max-width:430px;margin:90px auto;background:#f6f8fc}main{background:white;padding:30px;border-radius:15px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{background:#2667d6;color:white;border:0;border-radius:7px}a{color:#2667d6}</style>
<main><h2>{{ 'Регистрация' if register else 'Вход' }}</h2>{% if error %}<p style="color:red">{{error}}</p>{% endif %}
<form method="post"><input name="username" placeholder="Логин" required><input type="password" name="password" placeholder="Пароль" required><button>{{ 'Зарегистрироваться' if register else 'Войти' }}</button></form>
<a href="{{ '/login' if register else '/register' }}">{{ 'Уже есть аккаунт? Войти' if register else 'Нет аккаунта? Регистрация' }}</a></main></html>
